name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Check formatting
        # On failure, show exactly what Prettier would change.
        run: |
          if ! bunx prettier --check .; then
            bunx prettier --write . > /dev/null
            git --no-pager diff
            exit 1
          fi
      - run: bun run build
